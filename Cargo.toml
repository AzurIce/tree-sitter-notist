[package]
name = "tree-sitter-notist"
description = "Notist grammar for tree-sitter"
version = "0.1.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "notist"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/notist-lang/tree-sitter-notist"
edition = "2024"
autoexamples = false
build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26"
