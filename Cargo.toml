[package]
name = "tree-sitter-notist"
description = "Tree-sitter grammars for Notist native, code and Markdown frontends"
version = "0.1.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "notist"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/AzurIce/tree-sitter-notist"
edition = "2024"
autoexamples = false
build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/**", "notist-code/**", "notist-markdown/**", "notist-markdown-inline/**", "common/**", "vendor/**", "tree-sitter.json", "README.md", "LICENSE-*", "tests/**", "examples/**", "test/corpus/**"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26"
